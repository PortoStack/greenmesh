services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: greenhouse-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./.docker-volumes/mosquitto/data:/mosquitto/data
    networks:
      - greenhouse-net

  node-red:
    build:
      context: ./docker/nodered
      dockerfile: Dockerfile
    container_name: greenhouse-nodered
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    ports:
      - "1880:1880"
    volumes:
      - ./docker/nodered/data:/data
    networks:
      - greenhouse-net
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: greenhouse-client
    restart: unless-stopped
    depends_on:
      - node-red
      - mqtt-broker
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:1880
      - NEXT_PUBLIC_MQTT_URL=ws://localhost:9001
    networks:
      - greenhouse-net

networks:
  greenhouse-net:
    driver: bridge
