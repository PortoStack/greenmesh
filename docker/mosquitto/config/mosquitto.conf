# พอร์ตมาตรฐานสำหรับ ESP32 และ Node-RED
listener 1883
allow_anonymous true

# พอร์ต WebSocket สำหรับ Next.js Dashboard
listener 9001
protocol websockets
allow_anonymous true

# บันทึกสถานะการทำงาน
persistence true
persistence_location /mosquitto/data/

# Bridge เชื่อมโยงไปยัง Public EMQX Broker (เพื่อให้ Wokwi Simulator คุยกับ Server เครื่องเราได้)
connection emqx_bridge
address broker.emqx.io:1883
topic greenhouse/# both 0
remote_clientid greenmesh_bridge
try_private false