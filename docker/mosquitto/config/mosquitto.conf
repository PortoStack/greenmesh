# พอร์ตมาตรฐานสำหรับ ESP32 และ Node-RED
listener 1883
allow_anonymous true

# พอร์ต WebSocket สำหรับ Next.js Dashboard
listener 9001
protocol websockets
allow_anonymous true

# บันทึกสถานะการทำงาน
persistence true
persistence_location /mosquitto/data/

# Bridge เชื่อมโยงไปยัง Public EMQX Broker (สำหรับ Wokwi Simulator)
# หมายเหตุ: เมื่อทดสอบกับฮาร์ดแวร์ ESP32 จริง ให้ปิด (comment out) ส่วนนี้ไว้
# เพื่อไม่ให้ Client ID ชนกับภายนอกบน broker.emqx.io ซึ่งจะทำให้โบรกเกอร์ตัดการเชื่อมต่อรัวๆ
# connection emqx_bridge
# address broker.emqx.io:1883
# topic greenhouse/# both 0
# remote_clientid greenmesh_bridge
# try_private false